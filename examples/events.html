<html>
  <head>
    <meta charset="utf-8" />
    <title>Cluster clicks and clustering events</title>

    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }

      body {
        display: flex;
      }

      #map {
        flex-grow: 1;
      }

      #panel {
        width: 320px;
        padding: 1rem;
        overflow-y: auto;
        font-family: sans-serif;
      }

      #log {
        padding-left: 1.2rem;
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="panel">
      <label>
        On cluster click
        <select id="click-mode" autocomplete="off">
          <option value="default">Zoom to cluster (default)</option>
          <option value="info">Show an info window</option>
          <option value="none">Nothing (onClusterClick: null)</option>
        </select>
      </label>
      <p>
        <button id="remove-listeners" autocomplete="off">
          Remove listeners
        </button>
      </p>
      <ul id="log" aria-live="polite"></ul>
    </div>
    <script src="events.js" type="module"></script>
    <script src="vendor.js" type="module"></script>
  </body>
</html>
